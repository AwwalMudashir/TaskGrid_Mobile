name: Build TaskGrid APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: true
      EXPO_PUBLIC_API_URL: https://api--taskgrid-server--glqzmhjlzbpt.code.run/api/v1
      EXPO_PUBLIC_API_URL_RENDER_FALLBACK: https://taskgrid-backend.onrender.com/api/v1

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Set testing version code
        run: |
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle

      - name: Allow Gradle execution
        run: chmod +x android/gradlew

      - name: Verify supported Dojah Android SDK
        working-directory: android
        run: |
          ./gradlew :app:dependencyInsight --dependency sdk-kotlin --configuration releaseRuntimeClasspath --no-daemon | tee dojah-dependency.txt
          grep -q "com.github.dojah-inc:sdk-kotlin:v0.4.6" dojah-dependency.txt

      - name: Prevent Dojah BlurView runtime crash
        working-directory: android
        run: |
          ./gradlew :app:dependencyInsight --dependency BlurView --configuration releaseRuntimeClasspath --no-daemon | tee blurview-dependency.txt
          grep -q "com.github.Dimezis:BlurView:version-2.0.3" blurview-dependency.txt
          if grep -q "com.github.Dimezis:BlurView:version-3" blurview-dependency.txt; then
            echo "An incompatible BlurView 3.x dependency would crash Dojah after the selfie step."
            exit 1
          fi

      - name: Build standalone APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaskGrid-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
